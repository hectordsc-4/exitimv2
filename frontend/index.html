<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EXI · Acceso</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="login-shell">
    <section class="login-panel">
      <p class="brand">EXI</p>

      <div id="view-login">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Introduce tu usuario y contraseña para acceder al sistema.</p>

        <form id="login-form" autocomplete="on">
          <label for="usr_codusr">Usuario</label>
          <input id="usr_codusr" name="usr_codusr" type="text" maxlength="20" required placeholder="ej. admin" />

          <label for="usr_pass">Contraseña</label>
          <div class="password-field">
            <input id="usr_pass" name="usr_pass" type="password" maxlength="200" required placeholder="••••••••" />
            <button type="button" id="toggle-pass" class="toggle-pass" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
              <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="currentColor" d="M12 5c-5.5 0-9.7 4.2-11 7 1.3 2.8 5.5 7 11 7s9.7-4.2 11-7c-1.3-2.8-5.5-7-11-7zm0 11.5A4.5 4.5 0 1 1 16.5 12 4.5 4.5 0 0 1 12 16.5zm0-7A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5z"/>
              </svg>
              <svg class="eye-closed hidden" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="currentColor" d="M3.3 2.3 2 3.6l3.1 3.1C3.2 8.3 1.7 10.1 1 12c1.3 2.8 5.5 7 11 7 2 0 3.8-.5 5.4-1.3l3 3 1.3-1.3zm8.7 14.2c-4.3 0-7.8-3-9.3-4.5.7-1 2-2.5 3.7-3.5l1.7 1.7a4.5 4.5 0 0 0 5.7 5.7l1.4 1.4c-1 .4-2.1.7-3.2.7zm.4-8.9-.9.9 3.3 3.3.9-.9zm7.9 1.5-1.6 1.6c.5.6.9 1.2 1.1 1.6-.7 1-2 2.5-3.7 3.5l-1.5-1.5c.8-.5 1.5-1.2 1.9-2.1l-4.3-4.3A4.5 4.5 0 0 0 9.5 8l-1.7-1.7C9.1 5.6 10.5 5 12 5c4.3 0 7.8 3 9.3 4.5z"/>
              </svg>
            </button>
          </div>

          <button type="submit" id="btn-login">Entrar</button>
        </form>

        <p class="forgot-wrap">
          <button type="button" id="link-forgot" class="link-btn">¿Has olvidado tu contraseña?</button>
        </p>
      </div>

      <div id="view-forgot" class="hidden">
        <h1>Recordar contraseña</h1>
        <p class="subtitle">Introduce el email de tu cuenta y te enviaremos la contraseña.</p>

        <form id="forgot-form" autocomplete="on">
          <label for="usr_email">Email</label>
          <input id="usr_email" name="usr_email" type="email" maxlength="200" required placeholder="ej. admin@exi.local" />

          <button type="submit" id="btn-forgot">Enviar contraseña</button>
        </form>

        <p class="forgot-wrap">
          <button type="button" id="link-back" class="link-btn">Volver al inicio de sesión</button>
        </p>
      </div>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="/static/config.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
